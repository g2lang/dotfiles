# Use Ctrl-a instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better terminal support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB:clipboard:extkeys"
set -g focus-events on
# Copy from tmux to the outer terminal (including over SSH) using OSC 52.
# Applications cannot inject tmux clipboard buffers with this setting.
set -s set-clipboard external

# Mouse support
set -g mouse on

# Modified Enter key support in pi
set -g extended-keys on
set -g extended-keys-format csi-u

# Larger history
set -g history-limit 100000

# Faster escape handling
set -sg escape-time 10

# Splits and windows inherit the current pane's directory.
bind -N 'Split right in current directory' | split-window -h -c "#{pane_current_path}"
bind -N 'Split down in current directory' - split-window -v -c "#{pane_current_path}"
bind -N 'New window in current directory' c new-window -c "#{pane_current_path}"

# Repeat resize keys after the prefix; zoom and session selection stay native.
bind -r -N 'Resize left' H resize-pane -L 5
bind -r -N 'Resize down' J resize-pane -D 5
bind -r -N 'Resize up' K resize-pane -U 5
bind -r -N 'Resize right' L resize-pane -R 5
bind -N 'Zoom pane' z resize-pane -Z
bind -N 'Choose session' s choose-tree -Zs
bind -N 'Open lazygit in a popup' g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Reload config
bind -N 'Reload tmux configuration' r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-like pane navigation
bind -N 'Select left pane' h select-pane -L
bind -N 'Select lower pane' j select-pane -D
bind -N 'Select upper pane' k select-pane -U
bind -N 'Select right pane' l select-pane -R

# Vim-like copy mode: prefix-[, v to select, y/Enter to copy, q to leave.
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Keep window names useful without letting applications rename them.
setw -g automatic-rename on
setw -g allow-rename off
set -g display-time 2500
set -g display-panes-time 1500
set -g repeat-time 500
set -g visual-bell off
set -g bell-action none

# Match lualine: flat outer edges, rounded inner segments, quiet inactive windows.
# Native formats only: no plugins, Git polling, or background status scripts.
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 60
set -g status-right-length 60
set -g @cxf-status-accent '#{?#{||:#{client_prefix},#{==:#{pane_mode},copy-mode}},#f9e2af,#89b4fa}'
set -g status-left '#[fg=#1e1e2e,bg=#{E:@cxf-status-accent},bold] #S#{?client_prefix, : PREFIX,#{?#{==:#{pane_mode},copy-mode}, : COPY,}} #[fg=#{E:@cxf-status-accent},bg=#1e1e2e,nobold]#[default] '
set -g status-right '#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #h #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M #[default]'
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#a6adc8] #I #W#{?window_zoomed_flag, [Z],} '
setw -g window-status-current-format '#[fg=#313244,bg=#1e1e2e]#[fg=#89b4fa,bg=#313244,bold] #I #W#{?window_zoomed_flag, [Z],} #[fg=#313244,bg=#1e1e2e,nobold]#[default]'
setw -g window-status-activity-style 'fg=#f9e2af'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#cba6f7,fg=#1e1e2e'
set -g clock-mode-colour '#89b4fa'

# Optional personal overrides; this file is not owned by Home Manager.
if-shell 'test -r "$HOME/.config/tmux/local.conf"' 'source-file ~/.config/tmux/local.conf'
